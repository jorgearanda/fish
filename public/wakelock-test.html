<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Awake Test</title>
<!--
  Why does a phone's screen still lock during FISH? The game asks the browser
  to keep the screen on (fish.js keepScreenAwake) but can't show the answer.
  This page asks the same way and shows the answer and the browser's reason.
  Open it on the phone, read the boxes, then leave the phone untouched for
  longer than its screen timeout. Not linked from anywhere.
-->
<style>
  :root { --bg: #fff; --fg: #222; --muted: #666; --line: #ccc; --yes: #1a7f37; --no: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #eee; --muted: #aaa; --line: #444; --yes: #4cc36b; --no: #ff6b6b; }
  }
  body { background: var(--bg); color: var(--fg); font: 16px/1.4 sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  #status { font-size: 22px; font-weight: bold; padding: 12px; border: 2px solid var(--line); border-radius: 8px; }
  .yes { color: var(--yes); border-color: var(--yes) !important; }
  .no { color: var(--no); border-color: var(--no) !important; }
  #idle { color: var(--muted); margin: 8px 0 16px; }
  button { font-size: 18px; padding: 12px 16px; margin: 0 0 16px; border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
  td { border-top: 1px solid var(--line); padding: 6px 4px; vertical-align: top; word-break: break-word; }
  td:first-child { color: var(--muted); width: 40%; }
  #log { font: 14px/1.4 monospace; white-space: pre-wrap; border-top: 1px solid var(--line); padding-top: 8px; }
</style>
</head>
<body>
<h1>Screen awake test</h1>
<div id="status">Starting…</div>
<div id="idle"></div>
<button id="ask" type="button">Tap to ask again</button>
<table id="facts"></table>
<div id="log"></div>

<script>
// Plain old JavaScript on purpose: it must run on old phone browsers
(function() {
  var lock = null;
  var lastTouch = Date.now();
  var started = Date.now();

  function $(id) { return document.getElementById(id); }
  function clock() { return new Date().toTimeString().slice(0, 8); }
  function log(text) { $('log').textContent = clock() + '  ' + text + '\n' + $('log').textContent; }
  function fact(name, value) {
    var row = $('facts').insertRow(-1);
    row.insertCell(0).textContent = name;
    row.insertCell(1).textContent = String(value);
  }
  function setStatus(awake, text) {
    $('status').textContent = text;
    $('status').className = awake ? 'yes' : 'no';
  }

  fact('Browser', navigator.userAgent);
  fact('Secure page (https)', window.isSecureContext);
  fact('Browser has the screen lock feature', 'wakeLock' in navigator);

  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'screen-wake-lock' }).then(function(p) {
      fact('Permission', p.state);
    }, function(e) {
      fact('Permission', 'cannot ask (' + e.name + ')');
    });
  }

  function ask(how) {
    if (!('wakeLock' in navigator)) {
      setStatus(false, 'NOT kept awake: this browser has no screen lock feature');
      log(how + ': no navigator.wakeLock');
      return;
    }
    if (lock) { log(how + ': already awake'); return; }
    navigator.wakeLock.request('screen').then(function(l) {
      lock = l;
      setStatus(true, 'Screen kept awake');
      log(how + ': granted');
      l.addEventListener('release', function() {
        lock = null;
        setStatus(false, 'NOT kept awake: the browser let go');
        log('released by the browser (page hidden: ' + (document.visibilityState !== 'visible') + ')');
      });
    }, function(e) {
      setStatus(false, 'NOT kept awake: refused');
      log(how + ': refused, ' + e.name + ': ' + e.message);
    });
  }

  // The same moments the game asks: on load, when the page shows again,
  // and on a tap (some browsers want a tap first)
  ask('on load, no tap');
  document.addEventListener('visibilitychange', function() {
    log('page ' + document.visibilityState);
    if (document.visibilityState === 'visible') ask('page shown again');
  });
  $('ask').addEventListener('click', function() { ask('after a tap'); });
  document.addEventListener('touchstart', function() { lastTouch = Date.now(); }, { passive: true });
  document.addEventListener('click', function() { lastTouch = Date.now(); });

  setInterval(function() {
    var s = Math.round((Date.now() - lastTouch) / 1000);
    $('idle').textContent = 'Not touched for ' + s + ' s · page open ' +
      Math.round((Date.now() - started) / 1000) + ' s';
  }, 1000);
})();
</script>
</body>
</html>
